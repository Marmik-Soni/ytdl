services:
  - type: web
    name: ytdl
    runtime: node
    plan: free
    buildCommand: |
      pnpm install
      pip3 install --upgrade yt-dlp yt-dlp-get-pot
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: YOUTUBE_COOKIES_B64
        sync: false
